services:
  profissionais-db:
    image: postgres:16-alpine
    container_name: profissionais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROFISSIONAIS_DB_USER:-profissionais_user}
      POSTGRES_PASSWORD: ${PROFISSIONAIS_DB_PASSWORD:-profissionais_pass}
      POSTGRES_DB: ${PROFISSIONAIS_DB_NAME:-profissionais_db}
    volumes:
      - profissionais_db_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFISSIONAIS_DB_USER:-profissionais_user} -d ${PROFISSIONAIS_DB_NAME:-profissionais_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  ms-profissionais:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-profissionais
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PROFISSIONAIS_DB_USER:-profissionais_user}:${PROFISSIONAIS_DB_PASSWORD:-profissionais_pass}@profissionais-db:5432/${PROFISSIONAIS_DB_NAME:-profissionais_db}
    depends_on:
      profissionais-db:
        condition: service_healthy
    ports:
      - "8005:8000"
    volumes:
      - ./src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Executa a suíte de testes num banco separado (profissionais_test).
  # Uso: docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${PROFISSIONAIS_DB_USER:-profissionais_user}:${PROFISSIONAIS_DB_PASSWORD:-profissionais_pass}@profissionais-db:5432/profissionais_test
    depends_on:
      profissionais-db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

volumes:
  profissionais_db_data:

