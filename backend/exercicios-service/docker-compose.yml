version: '3.8'

services:
  db-exercicios:
    image: postgres:15
    container_name: db_exercicios_terapeuticos
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: exercicios_db
    ports:
      - "5435:5432" 
    volumes:
      - postgres_data_exercicios:/var/lib/postgresql/data

volumes:
  postgres_data_exercicios: