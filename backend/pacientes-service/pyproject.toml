[project]
name = "pacientes-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "alembic>=1.13", "pydantic[email]>=2.6", "python-jose[cryptography]>=3.3"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
